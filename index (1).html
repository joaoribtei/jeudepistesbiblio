<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu de piste bibliographique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --drawer:#D3D8DC; --drawer-edge:#B9C0C6; --card:#FFFFFA; --ink:#1E2833; --muted:#5B6773;
  --red:#C1272D; --blue:#B7CCE3; --ok:#2E6B3F; --tab:#E9ECEE; --tab-on:#FFFFFA;
  --typed:"Courier Prime","Courier New",Courier,monospace;
  --ui:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --drawer:#1B2025; --drawer-edge:#2C333A; --card:#F2EFE6; --ink:#1E2833; --muted:#8C98A4;
  --red:#C1272D; --blue:#B3C6DB; --ok:#7BC48F; --tab:#2A3138; --tab-on:#F2EFE6;}}
:root[data-theme="dark"]{
  --drawer:#1B2025; --drawer-edge:#2C333A; --card:#F2EFE6; --ink:#1E2833; --muted:#8C98A4;
  --red:#C1272D; --blue:#B3C6DB; --ok:#7BC48F; --tab:#2A3138; --tab-on:#F2EFE6;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--drawer);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 48px}
header h1{font-family:var(--typed);font-weight:700;font-size:1.35rem;margin:0 0 4px;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header h1{color:#E6E3DA}}
:root[data-theme="dark"] header h1{color:#E6E3DA}
header p{margin:0 0 20px;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 2px;margin-bottom:-1px;scrollbar-width:thin}
.tab{flex:0 0 auto;min-width:36px;height:36px;border:1px solid var(--drawer-edge);border-bottom:none;border-radius:6px 6px 0 0;
  background:var(--tab);color:var(--muted);font:600 .8rem var(--ui);cursor:pointer;padding:0 6px}
.tab[disabled]{cursor:default;opacity:.45}
.tab.done{color:var(--ok)}
.tab.current{background:var(--tab-on);color:var(--ink);border-color:var(--tab-on)}
.card{position:relative;background:var(--card);border-radius:3px 3px 4px 4px;box-shadow:0 1px 0 var(--drawer-edge),0 12px 24px -16px rgba(0,0,0,.35);
  --pt:22px;padding:var(--pt) 26px 26px;font-family:var(--typed);font-size:1rem;
  --lh:1.6rem;line-height:var(--lh);

  animation:none}
.card.reveal{animation:pull .45s ease-out}
@keyframes pull{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.card.reveal{animation:none}}
.callno{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.card h2{font-family:var(--typed);font-size:1.2rem;margin:0 0 calc(var(--lh) * .75);padding-bottom:8px;line-height:1.35;border-bottom:2px solid var(--red)}
.card{overflow-wrap:anywhere}
.card p,.card ul{margin:0 0 .9em}.card>:last-child{margin-bottom:0}
.card ul{padding-left:1.4em}
.card li{list-style:none;position:relative}
.card li::before{content:"–";position:absolute;left:-1.1em}
.answer{margin-top:18px;background:var(--card);border-radius:4px;padding:18px 20px;box-shadow:0 1px 0 var(--drawer-edge)}
.answer label{display:block;font-weight:600;margin-bottom:6px;color:#1E2833}
.row{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1 1 240px;min-width:0;font:1rem var(--typed);padding:10px 12px;border:1.5px solid #8A96A3;border-radius:3px;background:#fff;color:#1E2833}
.answer input:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid #2F6DB5;outline-offset:2px}
.answer button{font:600 .95rem var(--ui);padding:10px 16px;border:none;border-radius:3px;background:#1E2833;color:#FFFFFA;cursor:pointer}
.answer button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.5em;margin:10px 0 0;font-size:.93rem;color:#1E2833}
.msg.err{color:var(--red)}
.solved{color:#2E6B3F;font-weight:600;margin:0}
footer{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
@media (max-width:480px){.wrap{padding:20px 12px 40px}.card{--pt:18px;padding:var(--pt) 16px 20px}.answer{padding:16px 14px}.answer button{flex:1 1 100%}.answer input{font-size:16px}}
.timer{margin:10px 0 0;font-size:.9rem;color:#5B6773;font-variant-numeric:tabular-nums}
.end label{margin-top:4px}
.recap{margin:0 0 14px;color:#1E2833;font-size:.95rem}
footer button{background:none;border:none;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Jeu de piste bibliographique</h1>
  <p>Chaque réponse exacte débloque la carte suivante. Votre progression est enregistrée dans ce navigateur.</p>
</header>
<nav class="tabs" id="tabs" aria-label="Cartes"></nav>
<article class="card" id="card" aria-live="polite"></article>
<section class="answer" id="answer"></section>
<footer><span id="count"></span><button id="reset" type="button">Recommencer le parcours</button></footer>
</div>

const KEY="jdp-biblio-v1";
function norm(s){
  s=s.normalize('NFD').replace(/\p{Mn}/gu,'').toLowerCase().replace(/\s+/g,'');
  for(const p of ['https://','http://','dx.doi.org/','doi.org/','hdl.handle.net/']) s=s.split(p).join('');
  s=s.replace(/^(doi|hdl):?/,'').replace(/^pp?\.?/,'').replace(/[^a-z0-9./:]/g,'').replace(/^\.+|\.+$/g,'');
  return s;
}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryDec(pw,e){
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},k,b64(e.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(_){return null}
}
async function unlock(n,pw){for(const e of DATA.locks[n]){const r=await tryDec(pw,e);if(r)return r}return null}

let cards={1:DATA.first}, answers={}, times={start:{},end:{}}, fails={}, admin={}, player="", view=1, tick=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(_){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:3,answers,cards,times,fails,admin,player}))}catch(_){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dur(ms){if(ms==null||isNaN(ms))return '—';let s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
  const p=x=>String(x).padStart(2,'0');return h?`${h} h ${p(m)} min ${p(s)} s`:`${m} min ${p(s)} s`}
function spent(n){const a=times.start[n];if(a==null)return null;return (times.end[n]??Date.now())-a}

function renderCard(c,anim){
  const el=document.getElementById('card');
  let html=`<div class="callno">${c.n<=20?'Carte '+c.n+' / 20':'Fin du parcours'}</div><h2>${esc(c.t)}</h2>`;
  let list=null;
  const flush=()=>{if(list){html+='<ul>'+list.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';list=null}};
  for(const line of c.b){
    if(line.startsWith('•')){list=list||[];list.push(line.replace(/^•\s*/,''));continue}
    flush(); html+=`<p>${esc(line)}</p>`;
  }
  flush();
  el.innerHTML=html; el.classList.remove('reveal');
  if(anim){void el.offsetWidth;el.classList.add('reveal')}
}
function startTick(n){
  clearInterval(tick);
  const upd=()=>{const e=document.getElementById('timer');if(e)e.textContent='Temps passé sur cette carte : '+dur(spent(n))};
  upd(); tick=setInterval(upd,1000);
}
function renderAnswer(n){
  clearInterval(tick);
  const a=document.getElementById('answer'), c=cards[n];
  if(n>20){renderEnd(a);return}
  const timed=n>=2 && times.start[n]!=null;
  if(answers[n]!==undefined && cards[n+1]){
    a.innerHTML=(admin[n]?`<p class="solved">Carte validée par le raccourci administrateur</p>`:`<p class="solved">Réponse validée : ${esc(answers[n])}</p>`)+(timed&&!admin[n]?`<p class="timer">Temps passé sur cette carte : ${dur(spent(n))}</p>`:'');return}
  a.innerHTML=`<div><label for="in">${esc(c.q)}</label><div class="row">
    <input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${esc(c.h)}">
    <button type="button" id="go">${n<20?'Débloquer la carte '+(n+1):'Valider'}</button></div>
    <p class="msg" id="msg" role="status"></p>${timed?'<p class="timer" id="timer"></p>':''}</div>`;
  if(timed)startTick(n);
  const submit=async()=>{
    const inp=document.getElementById('in'),btn=document.getElementById('go'),msg=document.getElementById('msg');
    const v=inp.value.trim(); if(!v){msg.className='msg err';msg.textContent='Saisissez une réponse.';return}
    btn.disabled=true; msg.className='msg'; msg.textContent='Vérification…';
    const nxt=await unlock(n,v); btn.disabled=false;
    if(!nxt){fails[n]=(fails[n]||0)+1;save();msg.className='msg err';msg.textContent='Ce n’est pas la réponse attendue. Vérifiez la source consultée et le format demandé.';inp.select();return}
    const now=Date.now(); answers[n]=v; cards[n+1]=nxt; if(norm(v)==='000')admin[n]=true;
    if(times.start[n]!=null&&times.end[n]==null)times.end[n]=now;
    if(n+1<=20&&times.start[n+1]==null)times.start[n+1]=now;
    save(); go(n+1,true);
  };
  document.getElementById('go').addEventListener('click',submit);
  document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
}
function rows(){const r=[];for(let n=2;n<=20;n++)r.push({n,t:cards[n]?cards[n].t:'',d:(!admin[n]&&times.start[n]!=null&&times.end[n]!=null)?times.end[n]-times.start[n]:null,f:fails[n]||0,a:!!admin[n]});return r}
function renderEnd(a){
  const r=rows(), known=r.filter(x=>x.d!=null), total=known.reduce((s,x)=>s+x.d,0), nadm=Object.keys(admin).filter(k=>+k>=2).length;
  a.innerHTML=`<div class="end"><p class="recap">Temps total mesuré (cartes 2 à 20) : <strong>${dur(total)}</strong>${(19-known.length-nadm)>0?` (${19-known.length-nadm} carte${19-known.length-nadm>1?'s':''} sans mesure)`:''}</p>${nadm?`<p class="recap">${nadm} carte${nadm>1?'s':''} validée${nadm>1?'s':''} par le raccourci administrateur.</p>`:''}
   <label for="name">Nom du participant ou de l’équipe</label><div class="row">
   <input id="name" type="text" autocomplete="name" value="${esc(player)}" placeholder="Prénom Nom">
   <button type="button" id="pdf">Télécharger le relevé (PDF)</button></div><p class="msg" id="msg" role="status"></p></div>`;
  const btn=document.getElementById('pdf'),msg=document.getElementById('msg'),inp=document.getElementById('name');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();btn.click()}});
  btn.addEventListener('click',async()=>{
    const name=inp.value.trim(); if(!name){msg.className='msg err';msg.textContent='Saisissez un nom avant de télécharger le relevé.';inp.focus();return}
    player=name; save(); msg.className='msg'; msg.textContent='Préparation du fichier…'; btn.disabled=true;
    const bytes=buildPdf(name,r,total);
    const fname='releve_jeu_de_piste_'+name.normalize('NFD').replace(/\p{Mn}/gu,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')+'.pdf';
    try{
      const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
      if(dl){await dl.save({filename:fname,data:new Blob([bytes],{type:'application/pdf'})}); msg.textContent='Relevé téléchargé.'}
      else{const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const l=document.createElement('a');l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg.textContent='Relevé téléchargé.'}
    }catch(e){msg.className='msg err';msg.textContent=e&&e.code==='declined'?'Téléchargement annulé.':'Le téléchargement n’a pas pu aboutir dans cet affichage. Réessayez ou ouvrez la page dans un autre navigateur.'}
    btn.disabled=false;
  });
}
/* Minimal PDF writer (A4, Helvetica, WinAnsi) */
function buildPdf(name,r,total){
  const W1252={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,0x203A:155,0x0153:156,0x017E:158,0x0178:159};
  const enc=s=>{let o='';for(const ch of String(s)){const c=ch.codePointAt(0);let b=c<128||(c>=160&&c<256)?c:(W1252[c]??63);if(c===0x2009||c===0x202F)b=32;const x=String.fromCharCode(b);o+=(x==='('||x===')'||x==='\\')?'\\'+x:x}return o};
  const fit=(s,max)=>s.length>max?s.slice(0,max-1)+'…':s;
  let cs='';const T=(x,y,s,sz=10,b=false)=>{cs+=`BT /${b?'F2':'F1'} ${sz} Tf ${x} ${y} Td (${enc(s)}) Tj ET\n`};
  const Ln=(x1,y1,x2,y2,w=0.5)=>{cs+=`${w} w ${x1} ${y1} m ${x2} ${y2} l S\n`};
  const L=56,R=539;let y=780;
  cs+='0.757 0.153 0.176 RG\n';Ln(L,y+22,R,y+22,2);cs+='0 0 0 RG\n';
  T(L,y,'Jeu de piste bibliographique — relevé des temps',16,true);y-=30;
  T(L,y,'Participant : '+fit(name,70),11,true);y-=16;
  const d=new Date();T(L,y,'Relevé établi le '+d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),10);y-=30;
  const cx=[L,L+40,L+300,L+400];
  T(cx[0],y,'Carte',10,true);T(cx[1],y,'Titre',10,true);T(cx[2],y,'Temps',10,true);T(cx[3],y,'Essais erronés',10,true);y-=6;Ln(L,y,R,y,0.8);y-=15;
  for(const x of r){T(cx[0],y,String(x.n),10);T(cx[1],y,fit(x.t||'—',48),10);T(cx[2],y,x.a?'raccourci':dur(x.d),10);T(cx[3],y,String(x.f),10);y-=6;cs+='0.8 0.8 0.8 RG\n';Ln(L,y,R,y,0.4);cs+='0 0 0 RG\n';y-=15}
  y-=4;T(cx[1],y,'Temps total (cartes 2 à 20)',10,true);T(cx[2],y,dur(total),10,true);y-=34;
  T(L,y,'Temps mesuré entre l’affichage de chaque carte et la validation de la bonne réponse, pauses comprises.',8.5);y-=12;
  T(L,y,'« — » : temps non mesuré (carte débloquée avant l’activation du chronomètre).',8.5);y-=12;
  const adm=Object.keys(admin).map(Number).sort((p,q)=>p-q);if(adm.length)T(L,y,'Cartes validées par le raccourci administrateur (exclues du total) : '+adm.join(', ')+'.',8.5,true);
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>',
    `<< /Length ${cs.length} >>\nstream\n${cs}endstream`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  for(let i=1;i<=21;i++){
    const b=document.createElement('button'); b.type='button'; b.className='tab';
    b.textContent=i<=20?i:'Fin'; b.setAttribute('aria-label',i<=20?'Carte '+i:'Fin du parcours');
    if(!cards[i]) b.disabled=true;
    if(answers[i]!==undefined && cards[i+1]) b.classList.add('done');
    if(i===view){b.classList.add('current');b.setAttribute('aria-current','step')}
    b.onclick=()=>go(i,false); t.appendChild(b);
    if(i===view) requestAnimationFrame(()=>b.scrollIntoView({block:'nearest',inline:'nearest'}));
  }
  const done=Object.keys(answers).filter(k=>cards[+k+1]).length;
  document.getElementById('count').textContent=`${done} étape${done>1?'s':''} validée${done>1?'s':''} sur 20`;
}
function go(n,anim){view=n;renderCard(cards[n],anim);renderAnswer(n);renderTabs();if(anim)(document.getElementById('in')||document.getElementById('name'))?.focus()}
document.getElementById('reset').onclick=()=>{
  if(!confirm('Effacer votre progression, vos temps et revenir à la carte 1 ?'))return;
  answers={};cards={1:DATA.first};times={start:{},end:{}};fails={};admin={};player="";save();go(1,false)};
(async()=>{
  go(1,false);
  if(!(window.crypto&&crypto.subtle)){const m=document.getElementById('msg');m.className='msg err';m.textContent='Ce navigateur ne permet pas de vérifier les réponses. Ouvrez la page dans un navigateur récent (Chrome, Firefox, Safari, Edge).';document.getElementById('go').disabled=true;return}
  const saved=load(); let n=1;
  if((saved.v===2||saved.v===3)&&saved.cards&&saved.answers){answers=saved.answers;cards=saved.cards;times=saved.times||{start:{},end:{}};fails=saved.fails||{};admin=saved.admin||{};player=saved.player||"";while(cards[n+1]&&answers[n]!==undefined)n++}
  else{while(saved[n]!==undefined && n<=20){const nxt=await unlock(n,saved[n]); if(!nxt)break; answers[n]=saved[n]; cards[n+1]=nxt; n++} if(n>1)save()}
  if(n>1)go(n,false);
})();
</script>
